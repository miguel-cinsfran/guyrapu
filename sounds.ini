# ─────────────────────────────────────────────────────────────────────────────
#  Guyrapu, configuración de sonidos de retroalimentación
# ─────────────────────────────────────────────────────────────────────────────
#
#  Este archivo controla los sonidos cortos que la aplicación reproduce ante
#  ciertos eventos (conectar, nuevo mensaje, Super Chat, etc.). Se editan con
#  Notepad. Hay que reiniciar para aplicar los cambios.
#
#  La primera vez, si no existen los sonidos, ejecuta una vez:
#
#      python scripts/sound_gen.py
#
#  Se creará la carpeta del tema por defecto: sounds/themes/default/ con un
#  WAV por sonido.
# ─────────────────────────────────────────────────────────────────────────────

[sonidos]
# Para silenciar todos los sonidos se usa F7 o el menú.
# El cambio se recuerda entre sesiones.

# Volumen global de los sonidos de retroalimentación.
# Rango 0.0 (silencio) a 1.0 (máximo). Es INDEPENDIENTE del volumen del TTS.
volumen = 0.7

# ─── Tema de sonido ─────────────────────────────────────────────────────────
# Un "tema" es una carpeta dentro de sounds/themes/ con un WAV por sonido.
# Además, puede traer un WAV con el nombre de un evento para darle a ese
# evento su propio sonido; si no lo trae, usa el de la familia que le toca.
#
# Para crear tu propio tema:
#   1. Copia la carpeta  sounds/themes/default  a  sounds/themes/mi_tema
#   2. Reemplaza o agrega los .wav que quieras.
#      Formato recomendado: WAV PCM 16-bit, 44100 Hz, breve (< 1 s).
#   3. Pon aquí el nombre de tu carpeta:
tema = default

# Archivos que trae el tema de fábrica (sounds/themes/default y suave):
#   app_inicio, mensaje_nuevo, mensaje_tiktok, mensaje_propietario
#   mensaje_moderador, mensaje_verificado, mensaje_miembro, superchat
#   nuevo_miembro, error, pausa, reanudar, copiar, espera, seguir, compartir
#   cofre, me_gusta, regalo_chico, regalo_mediano, regalo_grande, entrada
#   orilla, fin_directo, descarga_completada, descarga_fallida, al_aire
#   transmision_detenida, transmision_problema, aviso, transmision_recuperada
#   actualizacion_disponible, musica_tema, musica_fin, musica_fallo
#   musica_igualando, ia_respuesta, ia_analizando, microfono_sin_senal
#   microfono_bien, microfono_revisar, directo_pausado, directo_reanudado
#   cola_descargas_terminada, encuadre_fuera, encuadre_dentro, descarga_avance
#   descarga_quieta, encuesta, encuesta_fin, meta, batalla, batalla_fin

# ─── Overrides por evento (avanzado, opcional) ──────────────────────────────
# Puedes forzar un archivo concreto para un evento; tiene prioridad sobre el
# tema. Para SILENCIAR un evento, deja el valor vacío. Ejemplos:
#   superchat = C:\Sonidos\mi_campana.wav
#   copiar =
